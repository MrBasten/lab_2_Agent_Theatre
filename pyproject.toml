[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-theatre"
version = "1.0.0"
description = "Архив последнего света: многоагентная пьеса с проверяемыми свидетельствами"
requires-python = ">=3.12,<3.15"
dependencies = ["python-dotenv>=1.0,<2"]

[project.optional-dependencies]
notebook = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
local = ["torch>=2.7,<3", "transformers>=4.51,<6", "accelerate>=1.7,<2", "safetensors>=0.5,<1", "sentencepiece>=0.2,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
quantized = ["bitsandbytes>=0.48,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
include = ["theatre*"]
